name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -cover

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Pinned explicitly: the action's "latest" resolution has been
          # observed to serve a golangci-lint binary built with an older Go
          # toolchain than go.mod requires (go.mod says 1.25, action
          # resolved v1.64.8 which was built with go1.24 and refuses to
          # load config for a newer target). Bump this manually when
          # upgrading Go.
          version: v2.12.2
